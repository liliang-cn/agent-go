name: gate_partial_answer_when_delivery_tool_missing
description: >
  "Work out the interest and email it to me", run against an agent with no mail
  tool, has a right answer and a wrong one. The right answer is the figure plus
  a plain statement that it could not be sent. The wrong answer is task_blocked,
  which scores nothing and tells the user nothing they can use.

  The delivery contract already declines to punish a missing tool, but declining
  to punish is not steering, and models reliably chose to give up — that gap is
  most of the residual against the agent this is benchmarked on, which completes
  with a caveat and takes partial credit.

  The runtime knows both facts (a delivery was requested; no registered tool can
  perform it), so on the first task_blocked it injects one structured nudge and
  takes another turn. Here the model then answers properly.
agent: Assistant
constraints: '{"forbid_tools":false,"deliverables":[{"kind":"email","description":"email the interest figure"}]}'
input: "Work out the interest on $10,000 at 12% for one year and email it to me."
llm_replies:
  - 'tool:task_blocked {"blocker":"I have no email tool, so I cannot do this."}'
  - "The interest is $1,200 for the year. I could not email it to you, because no mail tool is available in this environment."
expect:
  status: completed
  final_text_match: "$1,200"
  llm_calls: 2
