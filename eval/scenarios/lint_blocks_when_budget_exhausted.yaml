name: lint_blocks_when_budget_exhausted
description: >
  When a lint always rejects the model's response, the runtime should
  exhaust its retry budget and emit a Blocked event naming the lint,
  rather than looping forever. Uses the agent-agnostic
  no_planning_only_finish lint (v3 has no role-scoped lints).
agent: Assistant
register_lints:
  - no_planning_only_finish
input: "do the thing"
llm_replies:
  - "Next steps: I will call the tool and report back."
  - "Next steps: I will call the tool and report back."
  - "Next steps: I will call the tool and report back."
  - "Next steps: I will call the tool and report back."
expect:
  status: blocked
  final_text_match: "no_planning_only_finish"
  llm_calls: 3
  lint_violations:
    - lint: no_planning_only_finish
      count: 3
